    <link rel="stylesheet" href="styles.css" />

    <style>
        .oops {
            min-height: 100svh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(48px, 10vh, 120px) var(--pad);
        }

        .oops__code {
            font-family: var(--display);
            font-weight: 400;
            font-size: clamp(5rem, 22vw, 16rem);
            line-height: 0.9;
            letter-spacing: 0.01em;
        }

        .oops__title {
            font-family: var(--display);
            font-weight: 400;
            text-transform: uppercase;
            font-size: clamp(1.4rem, 4vw, 2.6rem);
            line-height: 1.05;
            letter-spacing: 0.01em;
            color: var(--gray-ghost);
            margin-top: 18px;
        }

        .oops__text {
            font-size: 0.95rem;
            color: var(--gray-text);
            max-width: 420px;
            margin-top: 28px;
        }

        .oops__back {
            margin-top: 36px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            border-bottom: 2px solid var(--black);
            padding-bottom: 4px;
        }

        .oops__back:hover {
            color: var(--gray-meta);
            border-color: var(--gray-meta);
        }
    </style>
</head>

<body>
    <main class="oops">
        <p class="oops__code">404</p>
        <h1 class="oops__title" data-i18n="nf_title">Aquí no hay datos.</h1>
        <p class="oops__text" data-i18n="nf_text">Esta página no existe. O existió y ya no, que viene a ser lo mismo para ti. Vuelve al principio, que ahí sí hay cosas.</p>
        <a class="oops__back" href="/" data-i18n="nf_back">Volver al portfolio</a>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
